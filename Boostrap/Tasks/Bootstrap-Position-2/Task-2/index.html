<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TASK-2</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      .box {
        width: 700px;
        height: 100px;
      }
      .progressbar {
        width: 700px;
        height: 2px;
        background: linear-gradient(to right, blue 50%, gray 50% 100%);
      }
      .circle{
        width: 40px;
        height: 40px;
      }
    </style>
  </head>
  <body>
    <div
      class="box m-auto mt-5 position-relative d-flex align-items-center justify-content-center"
    >
      <div class="progressbar"></div>
      <div class="circle rounded-circle bg-primary position-absolute start-0 top-50 translate-middle d-flex justify-content-center align-items-center text-white">1</div>
      <div class="circle rounded-circle bg-primary position-absolute start-50 top-50 translate-middle-y d-flex justify-content-center align-items-center text-white">2</div>
      <div class="circle rounded-circle bg-secondary position-absolute start-100 top-50  translate-middle d-flex justify-content-center align-items-center text-white">3</div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
