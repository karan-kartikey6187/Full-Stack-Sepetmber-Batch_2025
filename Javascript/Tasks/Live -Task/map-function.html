<script>
  Array.prototype.myMap = function (callback) {
    let result = [];
    for (let i = 0; i < this.length; i++) {
        result.push(callback(this[i], i, this));
    }
    return result;
  };

  arr= [2,4,5,7,3,2,1]
  newArr=[];
  arr.myMap((el)=>{
      newArr.push(el*el);
  })
  console.log(newArr);
</script>
