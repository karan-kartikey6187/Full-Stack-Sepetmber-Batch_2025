<script>
    function convertToFlat(arr){
        let finalArray= [];
        for (let el of arr){
            if (Array.isArray(el)){
                finalArray = finalArray.concat(convertToFlat(el));
            } 
            else {
                finalArray.push(el);
            }
        }
        return finalArray;
    }

    let array = [1,2,65,[4,5,7],2,3,[2]]
    console.log(convertToFlat(array));
</script>
