<script>
    function deepClone(data){
        if (Array.isArray(data)){
            let newArray =[];
            for (let i = 0; i< data.length; i++){
                newArray[i] =deepClone(data[i]);
            }
            return newArray
        }

        let newObject = {};
        for (let key in data){
            newObject[key]= deepClone(data[key]);
        }

        return newObject;
    }

    let obj1 = {
        name:"karan",
        address:{
            city: "Bageshwar"
        }
    };

    let obj2= deepClone(obj1)

    obj2.address.city ="Delhi";
    console.log(obj1);
    console.log(obj2);

    let arry =[1,3,[4,5,6,[2,44]]];
    let arry2 = deepClone(arry);

    console.log(arry);
    console.log(arry2);

</script>
