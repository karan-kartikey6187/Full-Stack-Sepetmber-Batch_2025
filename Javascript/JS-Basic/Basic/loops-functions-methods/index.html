    <script>

    <script>
      // String 
      let name="Karan";
      let str=`Hello My Name is ${name}`
      console.log(str)
      // Length
      console.log(name.length)
      // Length
      console.log(name.length)
      // Lowercase
      console.log(name.toLowerCase())
      console.log(name.toLocaleLowerCase())
      // Uppercase
      console.log(name.toUpperCase())
      console.log(name.toLocaleUpperCase())
      // charAt(index)
      console.log(name.charAt(0))
      console.log(name.charAt(1))
      console.log(name.charAt(2))
      console.log(name.charAt(3))
      console.log(name.charAt(4))
      // includes Case Sensitive
       console.log(name.includes("ka"))
      // Slice
      console.log(name.slice(0,3))
      // Replace
      let newName = name.replace("Karan","Kartikey")
      console.log(newName)
      // trim()
      let s ="  Hello  ";
      console.log(s.trim());
      // split(separator)
      fullName = "My Name is Karan Kartikey"
      let newStr= fullName.split()
      console.log(newStr)
      let newStr2= fullName.split("")
      console.log(newStr2)
      let newStr3= fullName.split(" ")
      console.log(newStr3)
