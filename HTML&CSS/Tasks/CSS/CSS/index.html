<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice</title>
    <style>
        * {
            box-sizing: border-box;
        }

        .triangle {
            width: 0px;
            height: 0px;
            border-bottom: 200px solid blue;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
        }

        .box {
            display: flex;
            height: 200px;
            width: 200px;
            margin-top: 20px;
            background-color: brown;
            justify-content: center;
            align-items: center;
        }

        .circle {
            display: flex;
            width: 100px;
            height: 100px;
            background-color: purple;
            border-radius: 50%;
            justify-content: center;
            align-items: center;
        }

        .circle p {
            font-size: 32px;
            font-weight: 500;
        }

        .triangle-2 {
            width: 0px;
            height: 0px;
            margin-top: 20px;
            border-bottom: 200px solid green;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
        }

        .card {
            margin-top: 20px;
            display: inline-block;
            height: 500px;
            width: 250px;
            border: 2px solid blue;
            border-radius: 10px;
        }
        .card img{
            max-width: 100%;
            
        }
        .card h2, .card p{
            font-size: 24px;
            
        }

        .circle-1{
            height: 200px;
            width: 200px;
            border-radius: 50%;
            margin-top: 20px;
            background-color: rgb(39, 14, 223);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .circle-1::before{
            content: 'Hello';
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 40px;
            width: 200px;
            background-color: rgb(238, 13, 13);

        }
        .triangle-3{
           height: 0px;
           width: 0px;
           border-bottom: 200px solid magenta;
           border-left: 100px solid transparent;
           border-right: 100px solid transparent;
        }
    </style>
</head>

<body>
    <div class="triangle">

    </div>
    <div class="box">
        <div class="circle">
            <p>Hello</p>
        </div>
    </div>
    <div class="triangle-2">

    </div>
    <div class="card">
        <img src="./computer-lab-sarjapur.jpg" alt="">
        <div class="content">
            <h2>Hello Karan</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Iste, molestiae. </p>
            <button>Submit</button>
        </div>
    </div>
        <div class="circle-1">
        </div>
        <div class="triangle-3">
        </div>
    </div>
</body>

</html>
