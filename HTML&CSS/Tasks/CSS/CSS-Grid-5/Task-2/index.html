<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Task-2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header>
        <h1>Grid Tasks</h1>
    </header>
    <main>
        <h2>Task-1</h2>
        <div class="grid-container-1">
            <div class="grid-item h-40px">One</div>
            <div class="grid-item h-40px">Two</div>
            <div class="grid-item h-40px">Three</div>
            <div class="grid-item h-40px">Four</div>
        </div>
        <h2>Task-2</h2>
        <div class="grid-container-2">
            <div class="grid-item">One</div>
            <div class="grid-item">Two</div>
        </div>
        <h2>Task-3</h2>
        <div class="grid-container-3">
            <div class="grid-item">One</div>
            <div class="grid-item">Two</div>
            <div class="grid-item">Three</div>
            <div class="grid-item">Four</div>
        </div>
        <h2>Task-4</h2>
        <div class="grid-container-4">
            <div class="grid-item">
                <img src="https://mdn.github.io/shared-assets/images/examples/balloons1.jpg" alt="">
                <div class="flex-container flex-1">
                    <div class="flex-item">balloon</div>
                    <div class="flex-item">red</div>
                    <div class="flex-item">sky</div>
                    <div class="flex-item">blue</div>
                    <div class="flex-item">Hot air balloon</div>
                </div>
            </div>
            <div class="grid-item">
                <img src="https://mdn.github.io/shared-assets/images/examples/balloons2.jpg" alt="">
                <div class="flex-container flex-2">
                    <div class="flex-item">balloons</div>
                    <div class="flex-item">houses</div>
                    <div class="flex-item">train</div>
                    <div class="flex-item">harborside</div>
                </div>
            </div>
            <div class="grid-item">
                <img src="https://mdn.github.io/shared-assets/images/examples/balloons3.jpg" alt="">
                <div class="flex-container flex-3">
                    <div class="flex-item">balloons</div>
                    <div class="flex-item">inflating</div>
                    <div class="flex-item">green</div>
                    <div class="flex-item">blue</div>
                </div>
            </div>
            <div class="grid-item">
                <img src="https://mdn.github.io/shared-assets/images/examples/balloons4.jpg " alt="">
                <div class="flex-container flex-4">
                    <div class="flex-item">balloon</div>
                    <div class="flex-item">sun</div>
                    <div class="flex-item">sky</div>
                    <div class="flex-item">summer</div>
                    <div class="flex-item">bright</div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
